<div class="space-y-3 px-1.5 py-2" itemprop="itemListElement" itemscope itemtype="https://schema.org/BlogPosting">
    <a href="{% url 'blog:detail' post.slug %}" class="w-full block" itemprop="url">
        <article class="p-4 space-y-3 rounded-xl hover:-translate-y-2 transition border border-gray-200 bg-white drop-shadow-md dark:bg-gray-800">
            <figure class="text-center block py-4" itemprop="image" itemscope itemtype="https://schema.org/ImageObject">
                {% if post.cover_image %}
                    <img src="{{ post.cover_image.url }}" class="h-50 rounded-xl w-full block mx-auto object-cover" alt="{{ post.title }}" itemprop="contentUrl">
                {% else %}
                    <span class="h-50 rounded-xl w-full flex items-center justify-center bg-gray-100 dark:bg-gray-700 text-4xl">📰</span>
                {% endif %}
                <meta itemprop="caption" content="{{ post.title }}">
            </figure>
            <section class="space-y-5">
                <div class="space-y-4">
                    {% if post.category %}
                    <h4 class="relative before:start-0 before:z-[-1] before:rounded-lg before:bg-gray-300 before:absolute before:top-1/2 before:h-px before:w-full before:-translate-y-1/2">
                        <span class="bg-secondary text-sm rounded text-white px-3 dark:bg-secondary-300" itemprop="articleSection">{{ post.category.name }}</span>
                    </h4>
                    {% endif %}
                    <h2 class="text-xl line-clamp-1 font-bold dark:text-white" itemprop="headline">{{ post.title }}</h2>
                </div>
                <div class="flex mt-8 flex-wrap justify-between items-center">
                    <div class="flex items-center" itemprop="datePublished" content="{{ post.published_at|date:'Y-m-d' }}">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 dark:text-white">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                        </svg>
                        <time class="ms-2 dark:text-white">{{ post.published_at|date:"d M Y" }}</time>
                    </div>
                    <div class="flex items-center" itemprop="interactionStatistic" itemscope itemtype="https://schema.org/InteractionCounter">
                        <meta itemprop="interactionType" content="https://schema.org/WatchAction">
                        <meta itemprop="userInteractionCount" content="{{ post.views_count }}">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 dark:text-white">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        <time class="ms-2 dark:text-white">{{ post.views_count }} بازدید</time>
                    </div>
                </div>
            </section>
        </article>
    </a>
</div>
