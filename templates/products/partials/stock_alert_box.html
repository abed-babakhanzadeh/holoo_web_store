<div id="stock-alert-box-{{ product.id }}" class="mt-3">
    {% if stock_alert %}
        <div class="flex items-center justify-between gap-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-xl p-3 text-sm">
            <span class="flex items-center gap-2 text-green-700 dark:text-green-300">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
                </svg>
                به محض موجود شدن این کالا، از طریق {% if stock_alert.channel == 'email' %}ایمیل{% else %}پیامک{% endif %} به شما اطلاع می‌دهیم.
            </span>
            <button type="button"
                    hx-post="{% url 'products:stock_alert' product.id %}"
                    hx-vals='{"action": "cancel"}'
                    hx-target="#stock-alert-box-{{ product.id }}"
                    hx-swap="outerHTML"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    class="text-xs text-gray-400 hover:text-red-500 underline shrink-0 whitespace-nowrap">
                لغو
            </button>
        </div>
    {% else %}
        <form hx-post="{% url 'products:stock_alert' product.id %}"
              hx-target="#stock-alert-box-{{ product.id }}"
              hx-swap="outerHTML"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              class="space-y-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3">
            <p class="text-sm font-bold dark:text-white flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 text-primary shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
                </svg>
                اطلاع بده وقتی موجود شد
            </p>

            {% if error %}
                <p class="text-red-500 text-xs">{{ error }}</p>
            {% endif %}

            <div class="flex flex-wrap gap-4 text-sm dark:text-zinc-300">
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="channel" value="sms" class="stock-alert-channel" data-target="#stock-alert-email-{{ product.id }}"
                           {% if selected_channel != 'email' %}checked{% endif %}>
                    <span dir="ltr">پیامک ({{ request.user.phone_number }})</span>
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="channel" value="email" class="stock-alert-channel" data-target="#stock-alert-email-{{ product.id }}"
                           {% if selected_channel == 'email' %}checked{% endif %}>
                    <span>ایمیل</span>
                </label>
            </div>

            <input type="email" name="email" id="stock-alert-email-{{ product.id }}" placeholder="آدرس ایمیل شما"
                   value="{{ request.user.email|default:'' }}"
                   class="{% if selected_channel != 'email' %}hidden{% endif %} w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary dark:bg-gray-700 dark:border-gray-600">

            <button type="submit"
                    class="w-full bg-primary-grad text-white font-bold text-sm rounded-lg py-2.5 transition hover:opacity-90">
                ثبت درخواست
            </button>
        </form>
    {% endif %}
</div>
