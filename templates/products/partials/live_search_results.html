{% if query %}
<div class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl shadow-lg overflow-hidden">
    {% if products %}
        <ul class="max-h-96 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-600" data-testid="live-search-list">
            {% include 'products/partials/live_search_items.html' %}
        </ul>
        <a href="{% url 'products:product_list' %}?q={{ query|urlencode }}" class="block text-center py-3 text-sm font-bold text-primary hover:bg-gray-50 dark:hover:bg-gray-600 border-t border-gray-100 dark:border-gray-600">
            مشاهده همه {{ total }} نتیجه برای «{{ query }}»
        </a>
    {% else %}
        <div class="p-4 text-center text-sm text-gray-400">نتیجه‌ای برای «{{ query }}» یافت نشد.</div>
    {% endif %}
</div>
{% endif %}
