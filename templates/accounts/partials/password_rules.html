    <li data-rule="length" class="flex items-center gap-1.5 text-gray-400 dark:text-gray-500">
        <span class="rule-icon">✕</span>
        <span>حداقل ۸ کاراکتر</span>
    </li>
    <li data-rule="letter" class="flex items-center gap-1.5 text-gray-400 dark:text-gray-500">
        <span class="rule-icon">✕</span>
        <span>حداقل یک حرف</span>
    </li>
    <li data-rule="digit" class="flex items-center gap-1.5 text-gray-400 dark:text-gray-500">
        <span class="rule-icon">✕</span>
        <span>حداقل یک عدد</span>
    </li>
    <li data-rule="symbol" class="flex items-center gap-1.5 text-gray-400 dark:text-gray-500">
        <span class="rule-icon">✕</span>
        <span>حداقل یک نماد (مانند ! @ # $ %)</span>
    </li>
